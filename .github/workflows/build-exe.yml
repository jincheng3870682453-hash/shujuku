name: Build Electron EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies and Build
        run: |
          cd electron
          npm install
          npm run build

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: shujuku-setup
          path: electron/release/*.exe
