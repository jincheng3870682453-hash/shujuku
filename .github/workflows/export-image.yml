name: Export Docker Image
on:
  workflow_dispatch:
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Pull and compress
        run: |
          docker pull ghcr.io/jincheng3870682453-hash/shujuku:latest
          docker save ghcr.io/jincheng3870682453-hash/shujuku:latest | gzip > shujuku.tar.gz
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: shujuku-docker-image
          path: shujuku.tar.gz
