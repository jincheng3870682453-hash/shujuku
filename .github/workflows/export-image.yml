name: Build & Export Docker Image

on:
  # 手动触发为主：CI 已覆盖每次 push 的镜像构建与健康检查（ci.yml docker job），
  # 这里只做「导出 tar.gz 产物」——大文件没必要每次 push 都跑
  workflow_dispatch:

concurrency:
  group: image-export-${{ github.ref }}
  cancel-in-progress: true

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shujuku:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Export to tar.gz
        run: |
          docker save shujuku:latest | gzip > shujuku.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: shujuku-docker-image
          path: shujuku.tar.gz
          retention-days: 30
