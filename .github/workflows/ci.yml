name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: 后端 pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r backend/requirements.txt
          pip install pytest pytest-timeout

      - name: 语法检查（app.py + backend 全量）
        run: python -m compileall -q app.py backend scripts

      - name: pytest 全量
        env:
          TMPDIR: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          PYTHONIOENCODING: utf-8
        run: python -m pytest backend/ -q --timeout=120

  frontend:
    name: 前端 tsc + build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: 类型检查 tsc --noEmit
        working-directory: frontend
        run: npx tsc --noEmit

      - name: 生产构建
        working-directory: frontend
        run: npm run build

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 7

  docker:
    name: Docker 镜像构建
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: 构建镜像（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: shujuku:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟——容器起得来且健康检查过
        run: |
          docker run -d --name smoke -p 5001:5001 shujuku:ci-${{ github.sha }}
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/api/health > /dev/null 2>&1; then
              echo "health OK"; exit 0
            fi
            sleep 2
          done
          echo "container did not become healthy"; docker logs smoke; exit 1
