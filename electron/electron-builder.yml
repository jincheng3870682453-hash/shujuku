appId: com.dynamic-registry.app
# 产物文件名用 ASCII（dmg/AppImage 文件名里中文会被部分工具截断，
# 实测 v6.1.0 dmg 变成 "-6.1.0.dmg"）；显示名仍由 nsis.uninstallDisplayName /
# 快捷方式名用中文，不受影响。
productName: Dynamic Registry
artifactName: ${productName}-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build

files:
  - "dist/**/*"
  - "node_modules/**/*"
  - "package.json"

extraResources:
  # ── 零依赖后端（PyInstaller onedir 产物，CI 里 pyinstaller 打好后放进 backend_dist/）──
  # 存在时整目录拷入 resources/backend_server/；Electron 优先用它启动后端，
  # 不存在时回退旧方案（系统 python3 + 源码，见 main.ts getBackendRuntime）。
  - from: "backend_dist/"
    to: "backend_server"
  - from: "../data/"
    to: "data/"
  - from: "../icon.ico"
    to: "icon.ico"
  - from: "build/icon.icns"
    to: "icon.icns"

asarUnpack:
  - "backend/**/*"

# ───── Windows NSIS ─────
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: ../icon.ico
  publisherName: Dynamic Registry

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: 动态数据登记系统
  uninstallDisplayName: 动态数据登记系统# ───── macOS ─────
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  # 未签名构建：CI 无证书时跳过签名；有证书（CSC_LINK）时去掉 identity:null 即自动签
  identity: null
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist

# ───── Linux ─────
linux:
  target:
    - target: AppImage
      arch:
        - x64
  icon: build/icon.png
  category: Utility